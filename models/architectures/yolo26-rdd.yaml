# Experiment B - RDD-YOLO: YOLO26 with the three RDD-YOLO modifications
# (Li et al., Applied Sciences 14(8):3360, 2024), ported from YOLOv8 to YOLO26.
#
# Differences vs yolo26-baseline.yaml (everything else is identical):
#   [1] SimAM   - parameter-free attention appended to the end of the backbone
#                 (new layer 11, after C2PSA). All later indices shift by +1.
#   [2] Bilinear - both neck upsamplers use corner-aligned bilinear
#                 interpolation instead of nearest-neighbour.
#   [3] GhostConv - the two standard 3x3/s2 Conv downsampling blocks in the
#                 neck (PAN path) are replaced with GhostConv.

nc: 4 # D00, D10, D20, D40
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, SimAM, []] # 11  [1] SimAM attention

head:
  - [-1, 1, nn.Upsample, [None, 2, "bilinear", True]] # 12  [2] bilinear
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 14
  - [-1, 1, nn.Upsample, [None, 2, "bilinear", True]] # 15  [2] bilinear
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small)
  - [-1, 1, GhostConv, [256, 3, 2]] # 18  [3] GhostConv
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)
  - [-1, 1, GhostConv, [512, 3, 2]] # 21  [3] GhostConv
  - [[-1, 11], 1, Concat, [1]] # cat head P5 (SimAM-refined)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large)
  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)
